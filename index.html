<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#F1F3F7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="TradeFlow Elite — Esnaf ve teknik servisler için iş, fatura ve tahsilat yönetimi" />
    <title>TradeFlow Elite</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css" />
  <style>
      body{background:#F1F3F7;margin:0}
      #tfsplash{position:fixed;inset:0;background:#F1F3F7;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:-apple-system,sans-serif}
      #tfsplash .tfm{font-family:Georgia,serif;font-size:44px;font-weight:800;color:#2E7490}
      #tfsplash .tfa{font-size:13px;font-weight:800;letter-spacing:0.25em;color:#1B2A4A;margin-top:8px}
      #tfsplash .tfe{color:#E4335A}
      #tfsplash .tfs{width:26px;height:26px;border:3px solid #DDE3EE;border-top-color:#2E7490;border-radius:50%;margin-top:18px;animation:tfd 0.8s linear infinite}
      @keyframes tfd{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body style="margin:0">
    <div id="tfsplash"><div class="tfm">T/F</div><div class="tfa">TRADEFLOW ERA<span class="tfe">İ</span></div><div class="tfs"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").then((kayit) => {
            // Her sayfa açılışında sunucudan taze sw.js kontrolü zorla
            kayit.update();
            // Yeni sürüm indirilip devreye girdiyse tespit et
            kayit.addEventListener("updatefound", () => {
              const yeni = kayit.installing;
              if (!yeni) return;
              yeni.addEventListener("statechange", () => {
                if (yeni.state === "activated") {
                  // Yeni service worker devreye girdi — sayfayı tazele
                  window.location.reload();
                }
              });
            });
          });
          // Sekme arka plandan öne gelince de güncelleme kontrolü yap
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
              navigator.serviceWorker.getRegistration().then((r) => r && r.update());
            }
          });
        });
      }
    </script>
    <script>
      // ── Sürüm kontrolü ───────────────────────────────────────────
      // iOS'ta ana ekrandan açılan uygulama çoğu zaman sayfayı yeniden
      // yüklemez, arka planda tuttuğu kopyayı geri getirir. Bu yüzden
      // yeni derleme kullanıcıya günlerce ulaşmayabiliyor.
      // Çözüm: index.html'i taze çekip içindeki derleme dosyasının adını
      // şu an yüklü olanla karşılaştır. Farklıysa bir kez tazele.
      (function () {
        function suankiDosya() {
          var s = document.querySelector('script[type="module"][src*="/assets/"]');
          if (s) return s.src.split("/").pop();
          var t = document.querySelector('script[type="module"]');
          return t ? t.src.split("/").pop() : null;
        }
        var suanki = suankiDosya();
        if (!suanki) return;

        function kontrol() {
          fetch("/index.html", { cache: "no-store" })
            .then(function (r) { return r.ok ? r.text() : null; })
            .then(function (metin) {
              if (!metin) return;
              var m = metin.match(/\/assets\/[A-Za-z0-9_.-]+\.js/g);
              if (!m || !m.length) return;
              var yeni = null;
              for (var i = 0; i < m.length; i++) {
                var ad = m[i].split("/").pop();
                if (ad.indexOf("index-") === 0) { yeni = ad; break; }
              }
              if (!yeni || yeni === suanki) return;
              // Aynı sürüm için ikinci kez tazeleme yapma — döngüye girmesin
              if (sessionStorage.getItem("tf_tazelendi") === yeni) return;
              sessionStorage.setItem("tf_tazelendi", yeni);
              if ("serviceWorker" in navigator) {
                navigator.serviceWorker.getRegistrations().then(function (kayitlar) {
                  var isler = kayitlar.map(function (k) { return k.update(); });
                  Promise.all(isler).catch(function () {}).then(function () { location.reload(); });
                });
              } else {
                location.reload();
              }
            })
            .catch(function () {});
        }

        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") kontrol();
        });
        window.addEventListener("pageshow", function (e) { if (e.persisted) kontrol(); });
        window.addEventListener("focus", kontrol);
        setTimeout(kontrol, 2500);
      })();
    </script>
  </body>
</html>
